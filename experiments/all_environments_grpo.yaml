version: 1
name: all_environments_on_policy_grpo
models:
  policy:
    backend: local
    name: /models/Qwen/Qwen3.6-35B-A3B
train:
  model: policy
  output_dir: ../runs/all_environments_grpo_claude_code
  options:
    batch_size: 8
    group_size: 4
    learning_rate: 1.0e-6
    mixture_steps_per_epoch: 100
    eval_every: 10
    eval_at_start: false
    save_optimizer: true
  environments:
  - id: cuda
    env: coding.cuda
    harness: arl_agent
    weight: 1
    options:
      train_set: ops6k
      test_fraction: 0.02
      max_tokens: 4096
      prompt_budget_tokens: 32768
  - id: swe
    env: coding.swe
    harness: claude_code
    weight: 1
    options:
      train_set: remote:/mnt/ai_data/benchmarks/swebench_verified/verified_test.jsonl
      swe_endpoint: http://10.0.134.70:18770
      swe_token_file: /root/ai_data/swe/service/token
      swe_proxy: http://10.0.134.70:10809
      test_fraction: 0.1
      eval_max_concurrency: 2
      max_tokens: 4096
      prompt_budget_tokens: 32768
  - id: programbench
    env: coding.programbench
    harness: mini_swe_agent
    weight: 1
    options:
      train_set: programbench
      programbench_task_ids: lh3__seqtk.94e7070,tomnomnom__gron.88a6234,cmatsuoka__figlet.202a0a8
      programbench_ssh_host: root@10.0.134.90
      programbench_python: /mnt/ai_data/benchmarks/programbench/.venv/bin/python
      programbench_blob_dir: /mnt/ai_data/benchmarks/programbench/blobs
      programbench_work_dir: /mnt/ai_data/arl/programbench_runs
      test_fraction: 0.34
      eval_max_concurrency: 1
      max_tokens: 4096
      prompt_budget_tokens: 32768
  - id: ifeval
    env: instruction_following.ifeval
    harness: direct
    weight: 1
    options:
      train_set: ifeval
      test_fraction: 0.1
      enable_thinking: false
      max_tokens: 2048
      prompt_budget_tokens: 8192
  - id: multicodeif
    env: instruction_following.multicodeif
    harness: multicodeif_self_repair
    weight: 1
    options:
      train_set: multicodeif
      test_fraction: 0.1
      multicodeif_constraints: [code_convention_naming_convention, data_structure_type]
      multicodeif_languages: [python]
      multicodeif_max_rounds: 3
      enable_thinking: false
      max_tokens: 4096
      prompt_budget_tokens: 32768
