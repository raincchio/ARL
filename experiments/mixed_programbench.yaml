version: 1
name: swe_ifeval_programbench_mixed_grpo
models:
  policy:
    backend: local
    name: /models/Qwen/Qwen3.6-35B-A3B
train:
  model: policy
  output_dir: ../runs/swe_ifeval_programbench_train_claude_code
  options:
    batch_size: 8
    group_size: 8
    num_epochs: 1
    mixture_steps_per_epoch: 100
    shuffle_seed: 0
    learning_rate: 1.0e-06
    eval_every: 10
    eval_at_start: false
    save_optimizer: true
  environments:
  - id: swe
    env: coding.swe
    harness: claude_code
    weight: 0.5
    options:
      train_set: remote:/mnt/ai_data/benchmarks/swebench_verified/verified_test.jsonl
      test_fraction: 0.1
      swe_endpoint: http://10.0.134.70:18770
      swe_token_file: /root/ai_data/swe/service/token
      swe_proxy: http://10.0.134.70:10809
      eval_max_concurrency: 2
      env_max_turns: 250
      swe_command_timeout: 60
      enable_thinking: true
      max_tokens: 4096
      prompt_budget_tokens: 32768
  - id: ifeval
    env: instruction_following.ifeval
    harness: direct
    weight: 0.3
    options:
      train_set: ifeval
      test_fraction: 0.1
      ifeval_split_seed: 0
      ifeval_reward_mode: strict
      eval_max_concurrency: 4
      enable_thinking: false
      max_tokens: 2048
      prompt_budget_tokens: 8192
  - id: programbench
    env: coding.programbench
    harness: mini_swe_agent
    weight: 0.2
    options:
      train_set: programbench
      programbench_task_ids: lh3__seqtk.94e7070,tomnomnom__gron.88a6234,cmatsuoka__figlet.202a0a8
      test_fraction: 0.34
      programbench_split_seed: 0
      programbench_ssh_host: root@10.0.134.90
      programbench_python: /mnt/ai_data/benchmarks/programbench/.venv/bin/python
      programbench_blob_dir: /mnt/ai_data/benchmarks/programbench/blobs
      programbench_work_dir: /mnt/ai_data/arl/programbench_runs
      programbench_reward_mode: fraction
      programbench_memory: 60g
      programbench_cpus: 20
      programbench_eval_cpus: 4
      programbench_branch_workers: 1
      programbench_eval_timeout: 3600
      eval_max_concurrency: 1
      env_max_turns: 1000
      programbench_command_timeout: 180
      max_tokens: 4096
      prompt_budget_tokens: 32768
evaluate:
  model: policy
  env: instruction_following.ifeval
  harness: direct
  output_dir: ../runs/mixed_ifeval_evaluate
  options:
    train_set: ifeval
    test_fraction: 0.1
    ifeval_split_seed: 0
    enable_thinking: false
    max_tokens: 2048
    prompt_budget_tokens: 8192
    group_size: 1
    temperature: 0.0
