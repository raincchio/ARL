# Full-model local GRPO; adjust model/GPU layout for your deployment.
POLICY=/models/Qwen/Qwen3.6-35B-A3B
TRAIN_GPUS=0,1,2,3,8,9,10,11
SAMPLER_GPUS=4,5,6,7,12,13,14,15
SAMPLER_DP=1
SAMPLING_UTIL=0.8
ZERO_OFFLOAD=optimizer
PORT=29526
PACK_TOKENS=0
HEAD_CHUNKS=0
REBALANCE=1
PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
DEEPSPEED_TIMEOUT=90
NCCL_DEBUG=WARN
harness=direct
train_set=ifeval
# Official 541 public benchmark prompts are re-split for this training experiment.
# A model trained here must not be reported as a clean full-IFEval evaluation.
test_fraction=0.1
ifeval_split_seed=0
ifeval_reward_mode=strict
ifeval_timeout=60
eval_max_concurrency=4
enable_thinking=False
batch_size=8
group_size=8
extra_samples=0
num_epochs=1
temperature=1.0
top_p=0.95
top_k=-1
max_tokens=2048
prompt_budget_tokens=8192
truncated_turn=mask
learning_rate=1e-6
warmup_steps=5
warmup_lr_scale=0.5
grad_clip=0.05
num_substeps=2
clip_low=0.2
clip_high=0.28
adv_estimator=grpo
group_adv_std=False
whiten_advantages=True
whiten_std=False
length_weighted_baseline=False
save_optimizer=False
eval_every=10
eval_at_start=False
eval_num_samples=1
save_every=5
log_path=./runs/ifeval_grpo_%m%d_v1
wandb_project=ARL

# ARM training runtime options; keep this recipe's existing separate GPU layout.
COLOCATE=0
COLOCATE_HEADROOM_GB=8
sampling_replay=False
router_replay=False
think_cost_free_tokens=0
think_budget=0
