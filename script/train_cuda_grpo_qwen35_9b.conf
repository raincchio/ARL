# ARL agentic GRPO × CudaEnv —— Qwen3.5-9B 版 (train_cuda_grpo_qwen35_9b.sh 用 CONF= 指过来)。
# 算法 / 对话形状 / 奖励跟 train_cuda_grpo.conf (Qwen3.8-27B) 完全一致, 只改模型和显存/卡位安排。
#
# 模型: Qwen3_5ForConditionalGeneration (model_type=qwen3_5, 和 Qwen3.6-27B 同架构)。训练端只加载
# 文本塔 (~9B, visual/mtp 在 ignore-list), vLLM 端 language_model_only + PIECEWISE cudagraph 自动开。
# 32 层 (GDN 线性注意力 : 全注意力 = 3:1), hidden 4096, vocab 248320 (lm_head 不共享)。
#
# ── 显存估算 (PPU 96G/卡, ZeRO-3, 梯度检查点, 单 datum 最长 32768+16384=49152 token) ──
#   训练状态 16 B/param × 9B = 144G:  bf16 参数 18 + bf16 梯度 18 + fp32 master/Adam m/v 108
#     8 rank 不 offload  -> 18G/卡
#     4 rank 不 offload  -> 36G/卡                      (4 rank + offload optimizer -> 9G/卡)
#   激活 (检查点边界)   49152 × 4096 × 2B × 32 层 ≈ 13G   (27B 是 5120×64 层 ≈ 32G)
#   logits [T, 248320] bf16 两份 (前向 + 梯度) ≈ 2 × 24G = 48G   <- 跟模型大小无关, 大头
#   ZeRO-3 预取/通信桶 + 碎片 ≈ 5~8G
#   => 8 卡不 offload ≈ 18+13+48+8 ≈ 87G, 跟 27B 在 8 卡 + offload optimizer 时实测的占用 (~81G, 余 ~15G) 同档
#      4 卡不 offload ≈ 105G 会 OOM; 4 卡就必须 ZERO_OFFLOAD=optimizer (≈78G)
#   9B 用 CPU Adam 每步要多花十几秒, 16 卡机上卡够用, 所以缺省是 8 卡训练、不 offload。
#
# ── 采样端 ──
#   bf16 权重 18G/副本。KV 只有 8 层全注意力在涨: 8 层 × 2(K,V) × 4 kv 头 × 256 × 2B = 32KB/token,
#   GDN 每条序列的状态是固定大小 (跟长度无关)。TP=2 单卡 9G 权重 + 0.85×96 的余量放得下 >2M token KV,
#   远多于 batch_size × (group_size+extra) 条 48k 轨迹要的量。
#   TP 必须同时整除 num_attention_heads=16 和 num_key_value_heads=4 -> 只能取 1/2/4。
#   agentic rollout 是串行多轮, 吃的是单条解码延迟而不是吞吐: 小 TP、多副本 (DP) 比一台 TP=8 好
#   (TP=8 本来也不合法)。所以 8 张采样卡切成 4 份 × TP=2, 每份的两张卡在同一个 NVLink quad 里。
#
# ── 8 卡机 ──
#   TRAIN_GPUS=0,1,2,3 SAMPLER_GPUS=4,5,6,7 SAMPLER_DP=2 ZERO_OFFLOAD=optimizer batch_size=8

# ── 模型 / 机器 ──
POLICY=/models/Qwen/Qwen3.5-9B
TRAIN_GPUS=0,1,2,3,8,9,10,11           # 跟 27B 一样用 A/B 组 (同 NUMA + 跨组 NVLink)
SAMPLER_GPUS=4,5,6,7,12,13,14,15
SAMPLER_DP=4                           # 4 份副本 × TP=2: [4,5] [6,7] [12,13] [14,15]
SAMPLING_UTIL=0.85
ZERO_OFFLOAD=none                      # 8 rank 下 9B 不用 offload (见上面的估算); 4 rank 时改成 optimizer
PORT=29523                             # 跟 27B 的 29522 错开, 两边可以在不同的机器上同时跑
PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
DEEPSPEED_TIMEOUT=90
NCCL_DEBUG=WARN

# ── 环境 (CudaEnv) ──
EVAL_ENDPOINT=http://10.0.134.90:8000
EVAL_CLIENT_MARGIN=1800
train_set=ops6k
test_set=
test_fraction=0.02
test_limit=64
env_max_turns=16
env_enable_analyze=False
env_reward_mode=best

# ── 渲染 ──
reasoning_effort=                      # Qwen3.5 的模板不认 reasoning_effort, 必须留空 (只认 enable_thinking)

# ── 批形状 / 采样 ──
# 9B 训练一步比 27B 快约 3 倍, 4 台采样副本也比一台 TP=8 能同时跑更多轨迹 -> 每批题数翻倍
# (16 题 × (8+2) = 160 条轨迹同时在跑), 让一批的墙钟和梯度噪声跟 27B 那边大致相当。
# 16 题 / 8 rank = 每 rank 2 题。
batch_size=16
group_size=8
extra_samples=2
num_epochs=1
temperature=1.0
top_p=0.95
top_k=20                               # Qwen3.5 官方 thinking 模式推荐也是 1.0 / 0.95 / 20
max_tokens=16384
# 跟 27B 同一个上限: 单 datum 最长 49152。logits 那 48G 不随模型变小而变小, 所以 9B 也不能
# 直接放长; 要放长得先开 KERNEL_RL_PACK_TOKENS + KERNEL_RL_HEAD_CHUNKS (分块 lm_head)。
prompt_budget_tokens=32768
truncated_turn=mask

# ── 优化 ──
# 小模型对同样的 lr 更不敏感, 但先跟 27B 用同一组 (Dr-GRPO 口径), 跑稳了再试 2e-6。
learning_rate=1e-6
grad_clip=0.05
num_substeps=2
clip_low=0.2
clip_high=0.28

# ── 评估 / 存档 ──
eval_every=10
eval_at_start=True
eval_num_samples=1
save_every=5                           # 9B 一份 HF checkpoint ~18G
log_path=./runs/cuda_grpo_q35_9b_%m%d_v1
wandb_project=ARL
