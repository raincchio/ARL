# SWE-bench Verified directly used for RL. Deterministic held-out partition from the same 500 instances.
POLICY=/models/Qwen/Qwen3.8-27B
TRAIN_GPUS=0,1,2,3,8,9,10,11
SAMPLER_GPUS=4,5,6,7,12,13,14,15
SAMPLER_DP=1
SAMPLING_UTIL=0.85
ZERO_OFFLOAD=optimizer
PORT=29524
PACK_TOKENS=0
HEAD_CHUNKS=0
REBALANCE=1
PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
DEEPSPEED_TIMEOUT=90
NCCL_DEBUG=WARN

# Same HTTP master and remote dataset as /root/share/swe-qwen-collect.
# Local/SSH compatibility: clear swe_endpoint and set swe_ssh_host/swe_python/swe_worker_script.
swe_endpoint=http://10.0.134.70:18770
swe_token_file=/root/ai_data/swe/service/token
swe_ssh_host=
train_set=remote:/mnt/ai_data/benchmarks/swebench_verified/verified_test.jsonl
swe_dataset_split=test
swe_work_dir=/mnt/ai_data/arl/swe_runs
swe_proxy=http://10.0.134.70:10809
swe_memory=4g
swe_cpus=2
swe_command_timeout=60
swe_eval_timeout=1800
# Active workspaces PER training rank. 8 ranks x 2 = at most 16 active trajectories.
eval_max_concurrency=2
test_fraction=0.1
test_limit=50
env_max_turns=250

batch_size=8
group_size=8
extra_samples=0
num_epochs=1
temperature=1.0
top_p=0.95
top_k=20
max_tokens=4096
prompt_budget_tokens=32768
truncated_turn=mask
learning_rate=1e-6
warmup_steps=5
warmup_lr_scale=0.5
grad_clip=0.05
num_substeps=2
clip_low=0.2
clip_high=0.28
adv_estimator=grpo
group_adv_std=False
whiten_advantages=True
whiten_std=False
length_weighted_baseline=False
mask_positive_incorrect=False
mask_negative_correct=False
think_cost_lambda=0
save_optimizer=False
eval_every=10
eval_at_start=False
eval_num_samples=1
save_every=5
log_path=./runs/swe_grpo_%m%d_v1
wandb_project=ARL

harness=claude_code

# ARM training runtime options; keep this recipe's existing separate GPU layout.
COLOCATE=0
COLOCATE_HEADROOM_GB=8
sampling_replay=False
router_replay=False
think_cost_free_tokens=0
think_budget=0
