# ARL agentic GRPO × CudaEnv 的缺省配置 (被 train_cuda_grpo.sh source; 命令行 key=value 优先)。
#
# 算法口径跟 ARM 4c (script/4c_train_qwen38.conf -> 4_train_grpo.conf, 2026-11-09 工作区 e838a9a) 一致:
#   Dr-GRPO (group_adv_std=False, whiten_std=False), adv per trajectory, lr 1e-6,
#   grad_clip 0.05, clip 0.2/0.28, num_substeps 2, extra_samples 2, kl 0, 无 RM。
# 对话形状跟 CudaAgent agent 模式 (script/4_train_agent.conf) 一致:
#   16 轮工具调用, 每轮生成 16k, top_k=20 (CudaAgent 实测 Qwen3.8 温度 1.0 不截 top_k 会退化;
#   ARM 4c 单轮 Kevin 是 -1, 两边口径不同, 这里按 agent 那边的实测走)。

# ── 模型 / 机器 ──
POLICY=/models/Qwen/Qwen3.8-27B        # RFT 之后换成 ../CudaAgent/runs/rft_v0/policy_full
TRAIN_GPUS=0,1,2,3,8,9,10,11           # ARM 4c 的 A/B 组 (16 卡 PPU 机, 同 NUMA + 跨组 NVLink)
SAMPLER_GPUS=4,5,6,7,12,13,14,15       # 一台 vLLM, TP=8
SAMPLER_DP=1
SAMPLING_UTIL=0.85
ZERO_OFFLOAD=optimizer                 # 27B 全参 + 长样本, 96G 卡不 offload 会顶满
PORT=29522
PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
DEEPSPEED_TIMEOUT=90
NCCL_DEBUG=WARN

# ── 环境 (CudaEnv) ──
EVAL_ENDPOINT=http://10.0.134.90:8000  # CudaEval 主节点 (/repo/evaluate)
EVAL_CLIENT_MARGIN=1800
train_set=ops6k                        # CudaTasks/tasks/ops6k (5019 题)
test_set=                              # 空 = 从 train_set 切 test_fraction
test_fraction=0.02
test_limit=64                          # held-out 最多评多少题 (一题一条 16 轮轨迹, 很贵)
env_max_turns=16
env_enable_analyze=False               # True = 加第七个工具 analyze (acu roofline); 换 prompt 分布
env_reward_mode=best                   # best = best-of-trajectory (论文) | final = 交卷判分

# ── 渲染 ──
reasoning_effort=                      # 空 = 模板缺省 (CudaAgent RFT 口径); medium = ARM 4c 口径

# ── 批形状 / 采样 ──
batch_size=8
group_size=8
extra_samples=2
num_epochs=1
temperature=1.0
top_p=0.95
top_k=20
max_tokens=16384
# harness 式历史 (思考原样保留, 见 CudaEnv messages()): prompt 预算管的是**整条累积上下文**,
# 一条轨迹合成一个 datum, 最长 = prompt_budget + 生成上限。ARM 4c 在 96G 卡上实测 ~50k 已经
# 是余量 ~15G 的上限 (logits [T, 248320] bf16 两份), 所以 32768 + 16384 = 49152 封顶, 默认不放宽
# 生成上限。要更长: 先开 PACK_TOKENS/HEAD_CHUNKS (分块 lm_head) 再调。超预算时环境逐级压缩
# (先丢老轮次的思考 -> 压摘要 -> 丢轮次), 那一轮起另起一个 datum。
prompt_budget_tokens=32768
truncated_turn=mask                    # 截断轮: 留在序列里但不进 loss, 轨迹继续 (env 会提醒它说短点)

# ── 优化 ──
learning_rate=1e-6
warmup_steps=5
warmup_lr_scale=0.5
adv_estimator=grpo
group_adv_std=False
group_adv_std_floor=0
whiten_advantages=True
whiten_std=False
length_weighted_baseline=False
mask_positive_incorrect=False
mask_negative_correct=False
think_cost_lambda=0                   # 轨迹内累计，每 8192 个 sampled thinking token 的代价
grad_clip=0.05
num_substeps=2
clip_low=0.2
clip_high=0.28

# ── 评估 / 存档 ──
eval_every=10
eval_at_start=True
eval_num_samples=1
save_every=5
save_optimizer=False                 # True: 只保留最新优化器状态，旧 policy 权重保留
log_path=./runs/cuda_grpo_%m%d_v1
wandb_project=ARL

# ARM training runtime options; keep this recipe's existing separate GPU layout.
COLOCATE=0
COLOCATE_HEADROOM_GB=8
sampling_replay=False
router_replay=False
think_cost_free_tokens=0
think_budget=0
